# Convenience only — the plain Dockerfile is self-sufficient.
# Usage: docker compose -f docker/docker-compose.yml up --build
services:
  hub:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: omp-hub:latest
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      HUB_TOKEN: ${HUB_TOKEN:?set HUB_TOKEN in the environment}
      # HUB_PUBLIC_URL: https://hub.example.com
      # HUB_TLS_CERT: /certs/cert.pem
      # HUB_TLS_KEY: /certs/key.pem
    # volumes:
    #   - ./certs:/certs:ro
    restart: unless-stopped
