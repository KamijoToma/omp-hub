name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  web-hub:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun --cwd=packages/web install --frozen-lockfile
      - run: bun --cwd=packages/hub install --frozen-lockfile
      - run: bun --cwd=packages/web run typecheck
      - run: bun --cwd=packages/web test
      - run: bun --cwd=packages/web run build
      - run: bun --cwd=packages/hub run typecheck
      - run: bun --cwd=packages/hub test
      - run: docker build -f docker/Dockerfile -t omp-hub:ci .
      - name: Stage tagged web assets and third-party licenses
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        run: |
          mkdir -p release-web/licenses
          cp -a packages/web/dist release-web/dist
          for package in react react-dom scheduler lucide-react marked; do
            cp "packages/web/node_modules/$package/LICENSE" "release-web/licenses/$package-LICENSE"
          done
      - uses: actions/upload-artifact@v4
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        with:
          name: web-bundle
          path: release-web/
          if-no-files-found: error

  agent:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun --cwd=packages/agent install --frozen-lockfile
      - run: bun --cwd=packages/agent run typecheck
      - run: bun --cwd=packages/agent test
      - name: Build Linux x64 native agent bundle
        run: bun packages/agent/scripts/build-native.ts --out-dir native-dist
      - name: Exercise isolated native session, usage and restart
        run: bun packages/agent/test/fixtures/native-smoke.ts native-dist
      - uses: actions/upload-artifact@v4
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        with:
          name: native-linux-x64
          path: native-dist/
          if-no-files-found: error

  release:
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
    needs: [web-hub, agent]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Validate release tag and source version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "invalid release tag: $RELEASE_TAG"; exit 1; }
          git merge-base --is-ancestor HEAD origin/main || { echo "tag must point to main history"; exit 1; }
          version="${RELEASE_TAG#v}"
          for package in hub agent web; do
            actual="$(PACKAGE="$package" bun -p 'require(`./packages/${process.env.PACKAGE}/package.json`).version')"
            [[ "$actual" == "$version" ]] || { echo "$package version $actual != $version"; exit 1; }
          done
      - name: Generate categorized release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: bun scripts/release-notes.ts "$GITHUB_REF_NAME" release-notes.md
      - uses: actions/download-artifact@v4
        with:
          name: web-bundle
          path: release-web
      - uses: actions/download-artifact@v4
        with:
          name: native-linux-x64
          path: native-linux-x64
      - name: Check downloaded native agent bundle
        run: |
          chmod +x native-linux-x64/omp-hub-agent{,-session,-stats,-subscriptions,-sql-query}
          bun packages/agent/test/fixtures/native-smoke.ts native-linux-x64
      - name: Assemble release archive and checksum
        run: |
          mkdir -p release/omp-hub/packages/{hub,agent,web} release/omp-hub/{licenses,docs/screenshots}
          cp -a packages/hub/{src,package.json,bun.lock,tsconfig.json} release/omp-hub/packages/hub/
          cp -a packages/agent/{src,types,patches,package.json,bun.lock,tsconfig.json,README.md} release/omp-hub/packages/agent/
          cp -a release-web/dist release/omp-hub/packages/web/dist
          cp -a release-web/licenses/. release/omp-hub/licenses/
          cp README.md README.zh-CN.md LICENSE release/omp-hub/
          cp docs/{architecture,protocol,milestones,e2e}.md release/omp-hub/docs/
          cp docs/screenshots/*.png release/omp-hub/docs/screenshots/
          cp packages/agent/README.md native-linux-x64/README.md
          tar -C native-linux-x64 -czf "release/omp-hub-agent-linux-x64-$GITHUB_REF_NAME.tar.gz" .
          tar -C release -czf "release/omp-hub-$GITHUB_REF_NAME.tar.gz" omp-hub
          (cd release && sha256sum "omp-hub-$GITHUB_REF_NAME.tar.gz" "omp-hub-agent-linux-x64-$GITHUB_REF_NAME.tar.gz" > SHA256SUMS.txt && sha256sum -c SHA256SUMS.txt)
      - name: Smoke-test unpacked archive
        run: |
          mkdir -p release/smoke
          tar -C release/smoke -xzf "release/omp-hub-$GITHUB_REF_NAME.tar.gz"
          bun --cwd=release/smoke/omp-hub/packages/agent install --frozen-lockfile
          bun release/smoke/omp-hub/packages/agent/src/main.ts --help
          bun -e '
            import { startHub } from "./release/smoke/omp-hub/packages/hub/src/server.ts";
            const hub = startHub({ port: 0, token: "release-ci", hostname: "127.0.0.1" });
            let agent;
            try {
              const health = await fetch(`${hub.url}/healthz`);
              if (health.status !== 200 || await health.text() !== "ok") throw new Error("hub healthz failed");
              const home = await fetch(hub.url);
              if (home.status !== 200 || !(await home.text()).includes("<script")) throw new Error("web UI missing");
              agent = Bun.spawn([
                "bun", "release/smoke/omp-hub/packages/agent/src/main.ts",
                "--hub", hub.url, "--token", "release-ci", "--machine-id", "release-ci-machine",
              ], { stdout: "inherit", stderr: "inherit" });
              const deadline = Date.now() + 10_000;
              let connected = false;
              while (Date.now() < deadline) {
                const response = await fetch(`${hub.url}/api/machines`, {
                  headers: { Authorization: "Bearer release-ci" },
                });
                const data = await response.json();
                connected = data.machines.some(machine => machine.machineId === "release-ci-machine" && machine.connected);
                if (connected) break;
                await Bun.sleep(100);
              }
              if (!connected) throw new Error("unpacked agent did not connect to the hub");
            } finally {
              if (agent) {
                agent.kill();
                await agent.exited;
              }
              hub.stop();
            }
          '
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          body_path: release-notes.md
          fail_on_unmatched_files: true
          files: |
            release/omp-hub-${{ github.ref_name }}.tar.gz
            release/omp-hub-agent-linux-x64-${{ github.ref_name }}.tar.gz
            release/SHA256SUMS.txt
